 });

async function filesIntoPrivateStorage(files){if(uploadBusy)return;uploadBusy=true;const report=[];$('chooseFiles').disabled=true;$('cameraButton').disabled=true;try{for(const file of files){try{if(!file.size||file.size>15*1024*1024)throw Error('Leere Datei oder mehr als 15 MB.');const data=await (await storageRequest('/api/receipts',{method:'POST',headers:{'Content-Type':file.type||'application/octet-stream','X-File-Name':encodeURIComponent(file.name)},body:file})).json();privateReceiptUsage=data.usage;renderReceiptUsage();docs.unshift(data.receipt);originals.set(data.receipt.id,{file,mime:data.receipt.mime,url:URL.createObjectURL(new Blob([await file.arrayBuffer()],{type:data.receipt.mime}))});report.push(file.name+': privat gespeichert.');}catch(error){report.push(file.name+': '+error.message);}}$('uploadReport').textContent=report.join('\n');render();toast('Dateiprüfung abgeschlossen. Details stehen im Upload-Bericht.');}finally{await refreshReceiptUsage();uploadBusy=false;$('chooseFiles').disabled=false;$('cameraButton').disabled=false;$('fileInput').value='';$('cameraInput').value='';}}

async function filesIn(files){

if(uploadBusy){toast('Bitte warte, bis die aktuelle Dateiprüfung abgeschlossen ist.');return;}
uploadBusy=true;const report=[];let count=0;
$('chooseFiles').disabled=true;$('cameraButton').disabled=true;$('demoButton').disabled=true;$('uploadReport').textContent='Dateien werden lokal geprüft …';
try{for(const file of files){try{
const ext=file.name.split('.').pop().toLowerCase();
if(!['pdf','jpg','jpeg','png','webp'].includes(ext)||!file.size||file.size>15*1024*1024){report.push(file.name+': abgelehnt (Format, leere Datei oder mehr als 15 MB).');continue;}

const pdf=String.fromCharCode(...bytes.slice(0,5))==='%PDF-';
const jpg=bytes[0]===255&&bytes[1]===216&&bytes[2]===255;
const png=[137,80,78,71,13,10,26,10].every((v,i)=>bytes[i]===v);
const webp=String.fromCharCode(...bytes.slice(0,4))==='RIFF'&&String.fromCharCode(...bytes.slice(8,12))==='WEBP';
if(!(ext==='pdf'?pdf:ext==='png'?png:ext==='webp'?webp:jpg)){report.push(file.name+': Dateiinhalt passt nicht zum Dateiformat.');continue;}
let duplicate=false;
for(const previous of originals.values()){if(previous.file.size!==file.size)continue;const other=new Uint8Array(await previous.file.arrayBuffer());if(bytes.every((v,i)=>v===other[i])){duplicate=true;break;}}
if(duplicate){report.push(file.name+': identischer Dateiinhalt bereits vorhanden; übersprungen.');continue;}
if(demoReceiptCount()>=200){report.push(file.name+': Kontingent von 200 Belegen für diesen Monat erreicht. Nicht hinzugefügt.');continue;}
const id='u'+(++seq);const mime=pdf?'application/pdf':png?'image/png':webp?'image/webp':'image/jpeg';
originals.set(id,{file,url:URL.createObjectURL(new Blob([bytes],{type:mime})),mime});
docs.push({id,name:file.name.replace(/\.[^.]+$/,'').replace(/[_-]/g,' '),file:file.name,size:file.size,date:'',amount:null,vat:null,invoiceNumber:'',payment:'Ungeklärt',kind:pdf?'Rechnung':'Kassenbon',sample:false,added:now(),history:[]});count++;report.push(file.name+': hinzugefügt – Angaben noch zu prüfen.');
}catch(error){report.push(file.name+': Datei konnte nicht gelesen werden.');}}
render();$('uploadReport').textContent=report.join('\n')||'Keine Dateien ausgewählt.';toast(count+' Datei(en) hinzugefügt. Keine automatische Belegauswertung in dieser Vorschau.');
}finally{uploadBusy=false;$('chooseFiles').disabled=false;$('cameraButton').disabled=false;$('demoButton').disabled=false;$('fileInput').value='';$('cameraInput').value='';}}

async function startReceiptCamera(){if(uploadBusy||photoBatchBusy){toast('Bitte warte, bis die Fotos hinzugefügt wurden.');return;}if(liveCameraStream)stopLiveCamera();cameraReturnFocus=document.activeElement;const run=++liveCameraRun;$('liveCameraBg').classList.add('open');$('liveCameraStatus').textContent='Bitte Kamerazugriff erlauben. Danach kannst du mehrere Belege nacheinander fotografieren.';updateLiveCameraCount();$('closeLiveCamera').focus();if(!window.isSecureContext||!navigator.mediaDevices?.getUserMedia){$('liveCameraStatus').textContent='Die Serienkamera ist hier nicht verfügbar. Öffne die Web-Vorschau direkt in Safari oder Chrome, oder nutze die Systemkamera.';return;}try{const stream=await navigator.mediaDevices.getUserMedia({audio:false,video:{facingMode:{ideal:'environment'},width:{ideal:2560},height:{ideal:1920}}});if(run!==liveCameraRun){stream.getTracks().forEach(track=>track.stop());return;}liveCameraStream=stream;const video=$('liveCameraVideo');video.srcObject=stream;await video.play();if(run!==liveCameraRun)return;$('liveCameraStatus').textContent='Beleg vollständig ins Bild halten und auslösen. Die Kamera bleibt für den nächsten Beleg geöffnet.';updateLiveCameraCount();}catch(error){if(run!==liveCameraRun)return;if(liveCameraStream){liveCameraStream.getTracks().forEach(track=>track.stop());liveCameraStream=null;}$('liveCameraVideo').srcObject=null;$('liveCameraStatus').textContent=error.name==='NotAllowedError'?'Kamerazugriff wurde nicht erlaubt. Erlaube der Webseite den Kamerazugriff in den Browser-Einstellungen oder nutze die Systemkamera.':'Kamera konnte nicht gestartet werden. Schließe andere Kamera-Apps oder nutze die Systemkamera.';updateLiveCameraCount();}}
async function captureLivePhoto(){const video=$('liveCameraVideo');if(liveCaptureBusy||!liveCameraStream)return;if(!video.videoWidth||!video.videoHeight){$('liveCameraStatus').textContent='Das Kamerabild wird vorbereitet. Bitte einen Moment warten.';return;}const run=liveCameraRun;liveCaptureBusy=true;updateLiveCameraCount();try{const canvas=document.createElement('canvas');const scale=Math.min(1,2600/Math.max(video.videoWidth,video.videoHeight));canvas.width=Math.round(video.videoWidth*scale);canvas.height=Math.round(video.videoHeight*scale);const context=canvas.getContext('2d');if(!context)throw Error('Canvas unavailable');context.drawImage(video,0,0,canvas.width,canvas.height);const blob=await new Promise((resolve,reject)=>canvas.toBlob(value=>value?resolve(value):reject(Error('Photo unavailable')),'image/jpeg',0.92));if(run!==liveCameraRun)return;const file=new File([blob],'Beleg_'+Date.now()+'_'+(++photoSeq)+'.jpg',{type:'image/jpeg'});stagePhotos([file]);$('liveCameraLast').src=pendingPhotos[pendingPhotos.length-1].url;$('liveCameraLast').hidden=false;$('liveCameraStatus').textContent='Foto aufgenommen. Lege den nächsten Beleg hin und löse erneut aus.';}catch(error){if(run===liveCameraRun)$('liveCameraStatus').textContent='Foto konnte nicht aufgenommen werden. Bitte erneut versuchen.';}finally{liveCaptureBusy=false;updateLiveCameraCount();}}
